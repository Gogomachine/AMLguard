<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TxPeek — AML Detective</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <div class="logo">🔍 TxPeek</div>
            <div class="subtitle">AML Detective</div>
        </header>

        <!-- Profile card -->
        <section id="profile-card" class="card">
            <div class="profile-header">
                <div class="avatar" id="avatar">🕵️</div>
                <div class="profile-info">
                    <h2 id="username">Загрузка...</h2>
                    <div class="level-badge" id="level-badge">Ур. 1</div>
                </div>
            </div>
            <div class="xp-bar">
                <div class="xp-fill" id="xp-fill" style="width: 0%"></div>
            </div>
            <div class="xp-label" id="xp-label">0 / 100 XP</div>
            <div class="stats-row">
                <div class="stat">
                    <span class="stat-value" id="checks-count">0</span>
                    <span class="stat-label">Проверок</span>
                </div>
                <div class="stat">
                    <span class="stat-value" id="streak">0</span>
                    <span class="stat-label">🔥 Стрик</span>
                </div>
                <div class="stat">
                    <span class="stat-value" id="level">1</span>
                    <span class="stat-label">Уровень</span>
                </div>
            </div>
        </section>

        <!-- Quick check -->
        <section class="card">
            <h3>🔎 Проверить адрес</h3>
            <div class="input-group">
                <input type="text" id="address-input" placeholder="Вставь крипто-адрес...">
                <button id="check-btn" onclick="checkAddress()">Проверить</button>
            </div>
            <div id="check-result" class="hidden"></div>
        </section>

        <!-- Recent checks -->
        <section class="card">
            <h3>📊 Последние проверки</h3>
            <div id="recent-checks">
                <p class="muted">Пока нет проверок</p>
            </div>
        </section>

        <!-- Leaderboard -->
        <section class="card">
            <h3>🏆 Топ детективов</h3>
            <div id="leaderboard">
                <p class="muted">Загрузка...</p>
            </div>
        </section>

        <!-- Global stats -->
        <section class="card stats-global">
            <div class="stat">
                <span class="stat-value" id="global-users">0</span>
                <span class="stat-label">Детективов</span>
            </div>
            <div class="stat">
                <span class="stat-value" id="global-checks">0</span>
                <span class="stat-label">Проверок</span>
            </div>
            <div class="stat">
                <span class="stat-value" id="global-risky">0</span>
                <span class="stat-label">🔴 Найдено</span>
            </div>
        </section>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
